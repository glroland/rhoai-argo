apiVersion: infrastructure.opendatahub.io/v1
kind: HardwareProfile
metadata:
  annotations:
    opendatahub.io/dashboard-feature-visibility: '[]'
    opendatahub.io/disabled: 'false'
    opendatahub.io/display-name: latest cpu
  name: latest-cpu
  namespace: redhat-ods-applications
spec:
  identifiers:
    - defaultCount: '4'
      displayName: CPU
      identifier: cpu
      maxCount: 4
      minCount: '4'
      resourceType: CPU
    - defaultCount: 8Gi
      displayName: Memory
      identifier: memory
      maxCount: 8Gi
      minCount: 8Gi
      resourceType: Memory
  scheduling:
    node:
      nodeSelector:
        kubernetes.io/hostname: envisionwired
      tolerations: []
    type: Node
