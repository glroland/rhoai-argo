kind: ConfigMap
apiVersion: v1
metadata:
  name: mcp-catalog-sources
  namespace: rhoai-model-registries
  labels:
    app: model-catalog
    component: model-catalog
data:
  sources.yaml: |
    mcp_catalogs:
      - name: "Lee's Favorite MCPs"
        id: "glroland-mcp-catalog"
        type: "yaml"
        enabled: true
        properties:
          yamlCatalogPath: "glroland-mcp-catalog.yaml"
        labels:
          - "Lee's Favorite MCP"
  glroland-mcp-catalog.yaml: |
    source: Lee's Favorite MCPs
    mcp_servers:
    - name: initmax/zabbix-mcp
      provider: initmax
      license: MIT
      license_link: https://opensource.org/licenses/MIT
      description: A comprehensive MCP server for the full Zabbix API, covering hosts, problems, events, dashboards, templates, discovery, users, and advanced analytics including anomaly detection and capacity forecasting.
      readme: |-
        # Zabbix MCP Server by initmax

        A Model Context Protocol (MCP) server providing complete access to the Zabbix API.
        Enables AI assistants to monitor, manage, and analyse Zabbix infrastructure through
        245 tools spanning every major Zabbix API object and several enhanced analytics
        capabilities not available in the native API.

        ## Features
        - **Full Host Lifecycle** — Create, update, delete, and mass-manage hosts, host groups, and interfaces
        - **Problem & Alert Management** — Query active problems, acknowledge/close events, inspect the alert log
        - **Dashboard & Reporting** — Manage dashboards, template dashboards, and scheduled reports; generate PDF reports
        - **Templates & Discovery** — Full template management plus Low-Level Discovery rules, prototypes, and multi-level (nested) discovery
        - **Items, Triggers & Graphs** — Complete CRUD for items, triggers, graphs, and their LLD prototypes
        - **History & Trends** — Retrieve raw history or aggregated trend data; push and clear history
        - **Configuration Import/Export** — Export and import Zabbix configuration as YAML, XML, or JSON
        - **User & Access Management** — Manage users, user groups, roles, LDAP/SAML directories, MFA, and API tokens
        - **Network Maps & SLAs** — Create and manage network topology maps and SLA definitions
        - **Maintenance & Correlation** — Define maintenance windows and event correlation rules
        - **Proxy & HA Management** — Manage proxies, proxy groups, and HA cluster nodes
        - **Advanced Analytics** — Anomaly detection via z-score analysis, capacity forecasting via linear regression, graph rendering to PNG
        - **Safe Write Workflow** — Prepare/confirm pattern for destructive write operations

        ## Tools (245 total)
        ### Hosts & Groups
        - host_get, host_create, host_update, host_delete, host_massadd, host_massremove, host_massupdate
        - hostgroup_get, hostgroup_create, hostgroup_update, hostgroup_delete, hostgroup_massadd, hostgroup_massremove, hostgroup_massupdate, hostgroup_propagate
        - hostinterface_get, hostinterface_create, hostinterface_update, hostinterface_delete, hostinterface_massadd, hostinterface_massremove, hostinterface_replacehostinterfaces

        ### Problems, Events & Alerts
        - problem_get, event_get, event_acknowledge, alert_get

        ### Items, Triggers & Graphs
        - item_get, item_create, item_update, item_delete
        - trigger_get, trigger_create, trigger_update, trigger_delete
        - graph_get, graph_create, graph_update, graph_delete, graphitem_get

        ### Templates & Template Groups
        - template_get, template_create, template_update, template_delete, template_massadd, template_massremove, template_massupdate
        - templategroup_get, templategroup_create, templategroup_update, templategroup_delete, templategroup_massadd, templategroup_massremove, templategroup_massupdate, templategroup_propagate

        ### Low-Level Discovery
        - discoveryrule_get, discoveryrule_create, discoveryrule_update, discoveryrule_delete
        - itemprototype_get, itemprototype_create, itemprototype_update, itemprototype_delete
        - triggerprototype_get, triggerprototype_create, triggerprototype_update, triggerprototype_delete
        - graphprototype_get, graphprototype_create, graphprototype_update, graphprototype_delete
        - hostprototype_get, hostprototype_create, hostprototype_update, hostprototype_delete
        - discoveryruleprototype_get, discoveryruleprototype_create, discoveryruleprototype_update, discoveryruleprototype_delete

        ### Dashboards & Reports
        - dashboard_get, dashboard_create, dashboard_update, dashboard_delete
        - templatedashboard_get, templatedashboard_create, templatedashboard_update, templatedashboard_delete
        - report_get, report_create, report_update, report_delete, report_generate

        ### History, Trends & Tasks
        - history_get, history_clear, history_push, trend_get
        - task_get, task_create

        ### Maps, SLAs & Maintenance
        - map_get, map_create, map_update, map_delete
        - sla_get, sla_create, sla_update, sla_delete, sla_getsli
        - maintenance_get, maintenance_create, maintenance_update, maintenance_delete

        ### Network Discovery
        - drule_get, drule_create, drule_update, drule_delete
        - dcheck_get, dhost_get, dservice_get
        - httptest_get, httptest_create, httptest_update, httptest_delete

        ### Actions, Scripts & Media
        - action_get, action_create, action_update, action_delete
        - action_prepare, action_confirm
        - script_get, script_create, script_update, script_delete, script_execute, script_getscriptsbyevents, script_getscriptsbyhosts
        - mediatype_get, mediatype_create, mediatype_update, mediatype_delete
        - alert_get

        ### Users, Groups & Auth
        - user_get, user_create, user_update, user_delete, user_login, user_logout, user_checkauthentication, user_provision, user_resettotp, user_unblock
        - usergroup_get, usergroup_create, usergroup_update, usergroup_delete
        - userdirectory_get, userdirectory_create, userdirectory_update, userdirectory_delete, userdirectory_test
        - role_get, role_create, role_update, role_delete
        - token_get, token_create, token_update, token_delete, token_generate
        - authentication_get, authentication_update, autoregistration_get, autoregistration_update
        - mfa_get, mfa_create, mfa_update, mfa_delete

        ### Configuration & Settings
        - configuration_export, configuration_import, configuration_importcompare
        - settings_get, settings_update, housekeeping_get, housekeeping_update
        - usermacro_get, usermacro_create, usermacro_update, usermacro_delete, usermacro_createglobal, usermacro_updateglobal, usermacro_deleteglobal
        - valuemap_get, valuemap_create, valuemap_update, valuemap_delete
        - regexp_get, regexp_create, regexp_update, regexp_delete
        - iconmap_get, iconmap_create, iconmap_update, iconmap_delete
        - image_get, image_create, image_update, image_delete
        - module_get, module_create, module_update, module_delete

        ### Infrastructure
        - proxy_get, proxy_create, proxy_update, proxy_delete
        - proxygroup_get, proxygroup_create, proxygroup_update, proxygroup_delete
        - hanode_get
        - correlation_get, correlation_create, correlation_update, correlation_delete
        - connector_get, connector_create, connector_update, connector_delete
        - auditlog_get

        ### Advanced / Analytics
        - graph_render — Render a Zabbix graph as a base64-encoded PNG
        - anomaly_detect — Z-score anomaly detection across a host group
        - capacity_forecast — Linear-regression capacity forecasting with confidence metric
        - health_check — MCP server and Zabbix connectivity health check
        - zabbix_raw_api_call — Direct passthrough to any Zabbix API method

        ## Authentication
        Connects via API token or username/password (ZABBIX_URL, ZABBIX_USER, ZABBIX_PASSWORD or ZABBIX_API_TOKEN).

        ## Prerequisites
        - Zabbix server 6.0+ with API access enabled
        - Python 3.11+ or Docker
        - Zabbix API user with read (and optionally write) permissions

        ## Quick Start
        ```bash
        docker pull ghcr.io/initmax/zabbix-mcp:latest
        ```

        ## Transports
        Supports stdio (default), SSE, and HTTP transports.
      version: 1.0.0
      transports:
        - stdio
        - http
        - sse
      logo: data:image/png;base64,
      documentationUrl: https://github.com/initmax/zabbix-mcp
      repositoryUrl: https://github.com/initmax/zabbix-mcp
      deploymentMode: local
      tags:
        - zabbix
        - monitoring
        - alerting
        - observability
        - analytics
      tools:
        # --- Dashboards ---
        - name: dashboard_get
          description: Retrieve dashboards with their widgets, pages, and user/group sharing settings.
          accessType: read_only
          parameters: []
        - name: dashboard_create
          description: Create a new dashboard with pages and widgets.
          accessType: read_write
          parameters: []
        - name: dashboard_update
          description: Update an existing dashboard. The params dict must include 'dashboardid'.
          accessType: read_write
          parameters: []
        - name: dashboard_delete
          description: Delete one or more dashboards by their IDs.
          accessType: read_write
          parameters: []
        - name: templatedashboard_get
          description: Retrieve dashboards that belong to templates.
          accessType: read_only
          parameters: []
        - name: templatedashboard_create
          description: Create a new template dashboard. Must specify 'templateid'.
          accessType: read_write
          parameters: []
        - name: templatedashboard_update
          description: Update a template dashboard. Params must include 'dashboardid'.
          accessType: read_write
          parameters: []
        - name: templatedashboard_delete
          description: Delete one or more template dashboards by their IDs.
          accessType: read_write
          parameters: []
        # --- Reports ---
        - name: report_get
          description: Retrieve scheduled reports.
          accessType: read_only
          parameters: []
        - name: report_create
          description: Create a new scheduled report. Requires 'name', 'dashboardid', and a schedule.
          accessType: read_write
          parameters: []
        - name: report_update
          description: Update a scheduled report. Params must include 'reportid'.
          accessType: read_write
          parameters: []
        - name: report_delete
          description: Delete one or more scheduled reports by their IDs.
          accessType: read_write
          parameters: []
        # --- HA ---
        - name: hanode_get
          description: Retrieve Zabbix server High Availability cluster nodes and their status.
          accessType: read_only
          parameters: []
        # --- History & Trends ---
        - name: history_get
          description: Retrieve historical item data. Always specify the 'history' type parameter.
          accessType: read_only
          parameters:
            - name: history
              type: integer
              description: Data type (0=float, 1=string, 2=log, 3=unsigned, 4=text)
              required: true
            - name: itemids
              type: string
              description: Comma-separated item IDs to filter by
              required: false
            - name: time_from
              type: string
              description: Start time as Unix timestamp
              required: false
            - name: time_till
              type: string
              description: End time as Unix timestamp
              required: false
        - name: history_clear
          description: Clear (delete) history data for the specified items. Cannot be undone.
          accessType: read_write
          parameters: []
        - name: history_push
          description: Push historical data into Zabbix for Trapper or Dependent items.
          accessType: read_write
          parameters: []
        - name: trend_get
          description: Retrieve trend data (hourly min/avg/max). Prefer over history for multi-day ranges.
          accessType: read_only
          parameters:
            - name: itemids
              type: string
              description: Comma-separated item IDs to filter by
              required: false
            - name: time_from
              type: string
              description: Start time as Unix timestamp
              required: false
            - name: time_till
              type: string
              description: End time as Unix timestamp
              required: false
        # --- Events & Problems ---
        - name: event_get
          description: Retrieve events including resolved ones. Use problem_get for active-only.
          accessType: read_only
          parameters:
            - name: hostids
              type: string
              description: Comma-separated host IDs to filter events by
              required: false
            - name: time_from
              type: string
              description: Start time as Unix timestamp
              required: false
            - name: time_till
              type: string
              description: End time as Unix timestamp
              required: false
            - name: severity_min
              type: integer
              description: Minimum severity level to filter by
              required: false
        - name: event_acknowledge
          description: Acknowledge, close, suppress, or change severity of events via bitmask action.
          accessType: read_write
          parameters:
            - name: eventids
              type: string
              description: Comma-separated event IDs to act on
              required: true
            - name: action
              type: integer
              description: Bitmask (1=close, 2=ack, 4=message, 8=change severity, 32=suppress, etc.)
              required: true
            - name: message
              type: string
              description: Message text (required when action includes add message)
              required: false
        - name: problem_get
          description: Retrieve active/unresolved problems. PRIMARY tool for current alerts.
          accessType: read_only
          parameters:
            - name: hostids
              type: string
              description: Comma-separated host IDs to filter problems by
              required: false
            - name: groupids
              type: string
              description: Comma-separated host group IDs to filter by
              required: false
            - name: severity_min
              type: integer
              description: Minimum severity (0=not classified … 5=disaster)
              required: false
            - name: acknowledged
              type: boolean
              description: Filter by acknowledgement state
              required: false
            - name: recent
              type: boolean
              description: Limit to problems created in the last 30 minutes
              required: false
        # --- Maps ---
        - name: map_get
          description: Retrieve network maps including elements and links.
          accessType: read_only
          parameters: []
        - name: map_create
          description: Create a new network map. Requires 'name', 'width', and 'height'.
          accessType: read_write
          parameters: []
        - name: map_update
          description: Update an existing network map. Params must include 'sysmapid'.
          accessType: read_write
          parameters: []
        - name: map_delete
          description: Delete one or more network maps by their IDs.
          accessType: read_write
          parameters: []
        # --- Tasks ---
        - name: task_get
          description: Retrieve internal Zabbix tasks such as check-now requests.
          accessType: read_only
          parameters: []
        - name: task_create
          description: Create a new task (e.g. check now for an item).
          accessType: read_write
          parameters: []
        # --- SLAs ---
        - name: sla_get
          description: Retrieve SLA definitions and their schedules and service tags.
          accessType: read_only
          parameters: []
        - name: sla_create
          description: Create a new SLA. Requires 'name', 'slo', 'period', 'timezone', and 'service_tags'.
          accessType: read_write
          parameters: []
        - name: sla_update
          description: Update an existing SLA. The 'slaid' field is required.
          accessType: read_write
          parameters: []
        - name: sla_delete
          description: Delete SLAs by their IDs.
          accessType: read_write
          parameters: []
        - name: sla_getsli
          description: Get SLA Service Level Indicator data showing period-by-period availability.
          accessType: read_only
          parameters:
            - name: slaid
              type: string
              description: SLA ID to retrieve SLI data for
              required: true
            - name: serviceids
              type: string
              description: Comma-separated service IDs to filter by
              required: false
        # --- Hosts ---
        - name: host_get
          description: Retrieve hosts. Core monitored entities representing servers, VMs, and devices.
          accessType: read_only
          parameters:
            - name: groupids
              type: string
              description: Comma-separated host group IDs to filter by
              required: false
            - name: hostids
              type: string
              description: Comma-separated host IDs to filter by
              required: false
        - name: host_create
          description: Create a new host. Requires 'host' (technical name) and 'groups'.
          accessType: read_write
          parameters: []
        - name: host_update
          description: Update an existing host. The 'hostid' field is required.
          accessType: read_write
          parameters: []
        - name: host_delete
          description: Delete hosts by their IDs including all related items, triggers, and graphs.
          accessType: read_write
          parameters: []
        - name: host_massadd
          description: Add groups, templates, macros, or interfaces to multiple hosts at once.
          accessType: read_write
          parameters: []
        - name: host_massremove
          description: Remove groups, templates, macros, or interfaces from multiple hosts at once.
          accessType: read_write
          parameters: []
        - name: host_massupdate
          description: Mass-update properties on multiple hosts at once.
          accessType: read_write
          parameters: []
        # --- Host Groups ---
        - name: hostgroup_get
          description: Retrieve host groups used to organize hosts and control permissions.
          accessType: read_only
          parameters: []
        - name: hostgroup_create
          description: Create a new host group. Requires the 'name' property.
          accessType: read_write
          parameters: []
        - name: hostgroup_update
          description: Update an existing host group. The 'groupid' field is required.
          accessType: read_write
          parameters: []
        - name: hostgroup_delete
          description: Delete host groups by their IDs (hosts are not deleted).
          accessType: read_write
          parameters: []
        - name: hostgroup_massadd
          description: Add hosts or templates to multiple host groups at once.
          accessType: read_write
          parameters: []
        - name: hostgroup_massremove
          description: Remove hosts or templates from multiple host groups at once.
          accessType: read_write
          parameters: []
        - name: hostgroup_massupdate
          description: Replace all hosts or templates in the specified host groups.
          accessType: read_write
          parameters: []
        - name: hostgroup_propagate
          description: Propagate permissions to child host groups.
          accessType: read_write
          parameters: []
        # --- Host Interfaces ---
        - name: hostinterface_get
          description: Retrieve host interfaces (agent, SNMP, JMX, IPMI).
          accessType: read_only
          parameters: []
        - name: hostinterface_create
          description: Create a new host interface. Requires 'hostid', 'type', 'main', 'useip', 'ip', 'dns', 'port'.
          accessType: read_write
          parameters: []
        - name: hostinterface_update
          description: Update an existing host interface. The 'interfaceid' field is required.
          accessType: read_write
          parameters: []
        - name: hostinterface_delete
          description: Delete host interfaces by their IDs. Cannot delete interfaces used by items.
          accessType: read_write
          parameters: []
        - name: hostinterface_massadd
          description: Add interfaces to multiple hosts at once.
          accessType: read_write
          parameters: []
        - name: hostinterface_massremove
          description: Remove interfaces from multiple hosts at once.
          accessType: read_write
          parameters: []
        - name: hostinterface_replacehostinterfaces
          description: Replace all interfaces on a host. Params must include 'hostid' and 'interfaces'.
          accessType: read_write
          parameters: []
        # --- Items ---
        - name: item_get
          description: Retrieve items (individual data collection points) for hosts.
          accessType: read_only
          parameters:
            - name: hostids
              type: string
              description: Comma-separated host IDs to filter items by
              required: false
        - name: item_create
          description: Create a new item. Requires 'hostid', 'name', 'key_', 'type', and 'value_type'.
          accessType: read_write
          parameters: []
        - name: item_update
          description: Update an existing item. The 'itemid' field is required.
          accessType: read_write
          parameters: []
        - name: item_delete
          description: Delete items by their IDs. Triggers referencing only deleted items are also removed.
          accessType: read_write
          parameters: []
        # --- Triggers ---
        - name: trigger_get
          description: Retrieve triggers defining alert conditions via item expressions.
          accessType: read_only
          parameters:
            - name: hostids
              type: string
              description: Comma-separated host IDs to filter triggers by
              required: false
        - name: trigger_create
          description: Create a new trigger. Requires 'description' and 'expression'.
          accessType: read_write
          parameters: []
        - name: trigger_update
          description: Update an existing trigger. The 'triggerid' field is required.
          accessType: read_write
          parameters: []
        - name: trigger_delete
          description: Delete triggers by their IDs.
          accessType: read_write
          parameters: []
        # --- Graphs ---
        - name: graph_get
          description: Retrieve graphs visualizing item data over time.
          accessType: read_only
          parameters: []
        - name: graph_create
          description: Create a new graph. Requires 'name' and 'gitems'.
          accessType: read_write
          parameters: []
        - name: graph_update
          description: Update an existing graph. The 'graphid' field is required.
          accessType: read_write
          parameters: []
        - name: graph_delete
          description: Delete graphs by their IDs.
          accessType: read_write
          parameters: []
        - name: graphitem_get
          description: Retrieve graph items (individual data series within a graph).
          accessType: read_only
          parameters: []
        # --- Templates ---
        - name: template_get
          description: Retrieve templates (reusable sets of items, triggers, graphs, and discovery rules).
          accessType: read_only
          parameters: []
        - name: template_create
          description: Create a new template. Requires 'host' and 'groups'.
          accessType: read_write
          parameters: []
        - name: template_update
          description: Update an existing template. The 'templateid' field is required.
          accessType: read_write
          parameters: []
        - name: template_delete
          description: Delete templates by their IDs, removing inherited entities from linked hosts.
          accessType: read_write
          parameters: []
        - name: template_massadd
          description: Add groups, hosts, or macros to multiple templates at once.
          accessType: read_write
          parameters: []
        - name: template_massremove
          description: Remove groups, hosts, or macros from multiple templates at once.
          accessType: read_write
          parameters: []
        - name: template_massupdate
          description: Replace groups, hosts, or macros for multiple templates at once.
          accessType: read_write
          parameters: []
        # --- Template Groups ---
        - name: templategroup_get
          description: Retrieve template groups used to organise templates and control access.
          accessType: read_only
          parameters: []
        - name: templategroup_create
          description: Create a new template group. Requires the 'name' property.
          accessType: read_write
          parameters: []
        - name: templategroup_update
          description: Update an existing template group. The 'groupid' field is required.
          accessType: read_write
          parameters: []
        - name: templategroup_delete
          description: Delete template groups by their IDs (templates are not deleted).
          accessType: read_write
          parameters: []
        - name: templategroup_massadd
          description: Add templates to multiple template groups at once.
          accessType: read_write
          parameters: []
        - name: templategroup_massremove
          description: Remove templates from multiple template groups at once.
          accessType: read_write
          parameters: []
        - name: templategroup_massupdate
          description: Replace all templates in the specified template groups.
          accessType: read_write
          parameters: []
        - name: templategroup_propagate
          description: Propagate permissions to child template groups.
          accessType: read_write
          parameters: []
        # --- Low-Level Discovery ---
        - name: discoveryrule_get
          description: Retrieve LLD rules that auto-discover entities and create objects from prototypes.
          accessType: read_only
          parameters: []
        - name: discoveryrule_create
          description: Create a new LLD rule. Requires 'hostid', 'name', 'key_', and 'type'.
          accessType: read_write
          parameters: []
        - name: discoveryrule_update
          description: Update an existing LLD rule. The 'itemid' field is required.
          accessType: read_write
          parameters: []
        - name: discoveryrule_delete
          description: Delete LLD rules and all their prototypes and discovered objects.
          accessType: read_write
          parameters: []
        - name: itemprototype_get
          description: Retrieve item prototypes used by LLD rules to create per-entity items.
          accessType: read_only
          parameters: []
        - name: itemprototype_create
          description: Create a new item prototype. Requires 'hostid', 'ruleid', 'name', 'key_', 'type', 'value_type'.
          accessType: read_write
          parameters: []
        - name: itemprototype_update
          description: Update an existing item prototype. The 'itemid' field is required.
          accessType: read_write
          parameters: []
        - name: itemprototype_delete
          description: Delete item prototypes by their IDs.
          accessType: read_write
          parameters: []
        - name: triggerprototype_get
          description: Retrieve trigger prototypes used by LLD rules to create per-entity triggers.
          accessType: read_only
          parameters: []
        - name: triggerprototype_create
          description: Create a new trigger prototype. Requires 'description' and 'expression' with LLD macros.
          accessType: read_write
          parameters: []
        - name: triggerprototype_update
          description: Update an existing trigger prototype. The 'triggerid' field is required.
          accessType: read_write
          parameters: []
        - name: triggerprototype_delete
          description: Delete trigger prototypes by their IDs.
          accessType: read_write
          parameters: []
        - name: graphprototype_get
          description: Retrieve graph prototypes used by LLD rules to create per-entity graphs.
          accessType: read_only
          parameters: []
        - name: graphprototype_create
          description: Create a new graph prototype. Requires 'name' and 'gitems' referencing item prototypes.
          accessType: read_write
          parameters: []
        - name: graphprototype_update
          description: Update an existing graph prototype. The 'graphid' field is required.
          accessType: read_write
          parameters: []
        - name: graphprototype_delete
          description: Delete graph prototypes by their IDs.
          accessType: read_write
          parameters: []
        - name: hostprototype_get
          description: Retrieve host prototypes that auto-create hosts for each discovered entity.
          accessType: read_only
          parameters: []
        - name: hostprototype_create
          description: Create a new host prototype. Requires 'host', 'ruleid', and 'groupLinks'.
          accessType: read_write
          parameters: []
        - name: hostprototype_update
          description: Update an existing host prototype. The 'hostid' field is required.
          accessType: read_write
          parameters: []
        - name: hostprototype_delete
          description: Delete host prototypes and their discovered hosts.
          accessType: read_write
          parameters: []
        - name: discoveryruleprototype_get
          description: Retrieve LLD rule prototypes (Zabbix 7.4+) for multi-level nested discovery.
          accessType: read_only
          parameters: []
        - name: discoveryruleprototype_create
          description: Create a new LLD rule prototype (Zabbix 7.4+). Requires 'hostid', 'name', 'key_', 'type'.
          accessType: read_write
          parameters: []
        - name: discoveryruleprototype_update
          description: Update an existing LLD rule prototype. The 'itemid' field is required.
          accessType: read_write
          parameters: []
        - name: discoveryruleprototype_delete
          description: Delete LLD rule prototypes by their IDs.
          accessType: read_write
          parameters: []
        # --- User Macros ---
