      runtimeMetadata:
        defaultArgs:
            - python
            - src/server.py
            - --host
            - 0.0.0.0
            - --transport
            - http
            - --port
            - "9001"
        defaultPort: 9001
        optionalEnvironmentVariables:
            - default: "true"
              description: Enforce read-only mode (disables all write operations)
              name: MCP_READ_ONLY
              type: config
        prerequisites:
            environmentVariables:
                - description: Zabbix server URL (from secret zabbix-credentials)
                  name: ZABBIX_URL
                  required: true
                  type: string
                - description: Zabbix API username (from secret zabbix-credentials)
                  name: ZABBIX_USER
                  required: false
                  type: string
                - description: Zabbix API password (from secret zabbix-credentials)
                  name: ZABBIX_PASSWORD
                  required: false
                  type: string
                - description: Zabbix API token (alternative to username/password, from secret zabbix-credentials)
                  name: ZABBIX_API_TOKEN
                  required: false
                  type: string
                - description: Enforce read-only mode (default true)
                  name: MCP_READ_ONLY
                  required: false
                  type: string
                - description: Comma-separated list of allowed Host header values
                  name: ALLOWED_HOSTS
                  required: true
                  type: string
            secrets:
                - description: kubectl create secret generic zabbix-credentials --from-literal=zabbix-url=<ZABBIX_URL> --from-literal=zabbix-user=<ZABBIX_USER> --from-literal=zabbix-password=<ZABBIX_PASSWORD>
                  keys:
                    - description: Zabbix server URL
                      envVarName: ZABBIX_URL
                      key: zabbix-url
                      required: true
                    - description: Zabbix API username
                      envVarName: ZABBIX_USER
                      key: zabbix-user
                      required: false
                    - description: Zabbix API password
                      envVarName: ZABBIX_PASSWORD
                      key: zabbix-password
                      required: false
                    - description: Zabbix API token
                      envVarName: ZABBIX_API_TOKEN
                      key: zabbix-api-token
                      required: false
                  mountAsFile: false
                  name: zabbix-credentials
        recommendedResources:
            minimal:
                cpu: 250m
                memory: 512Mi
            recommended:
                cpu: 500m
                memory: 1Gi
        requiredEnvironmentVariables:
            - description: Zabbix server URL
              name: ZABBIX_URL
              required: true
              type: config
            - description: Zabbix API username (required if ZABBIX_API_TOKEN is not set)
              name: ZABBIX_USER
              required: false
              type: secret
            - description: Zabbix API password (required if ZABBIX_API_TOKEN is not set)
              name: ZABBIX_PASSWORD
              required: false
              type: secret
            - description: Zabbix API token (alternative to username/password)
              name: ZABBIX_API_TOKEN
              required: false
              type: secret
            - description: Comma-separated list of allowed Host header values
              name: ALLOWED_HOSTS
              required: true
              type: config
      securityIndicators:
        readOnlyTools: false
        secureEndpoint: true
        verifiedSource: false
      customProperties:
        architecture:
            metadataType: MetadataStringValue
            string_value: "[\"amd64\"]"
      lastUpdateTimeSinceEpoch: "1774297749000"
